[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "contracts/out"
cache_path = "contracts/cache"
libs = ["node_modules"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=node_modules/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
]

[fmt]
line_length = 110

[lint]
# Lease windows are measured in days; second-level timestamp drift is irrelevant.
exclude_lints = ["block-timestamp"]
